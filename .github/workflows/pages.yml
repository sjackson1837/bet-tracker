name: Publish site (manual)

# The daily workflow builds AND deploys on its own schedule. This one exists
# only for when you've changed site/ or the templates by hand and want to
# publish immediately without burning Odds API calls on a full refresh.
#
# Run it from the Actions tab -> "Publish site (manual)" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the daily workflow so the two can never publish at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
