name: Daily refresh and deploy

on:
  schedule:
    # GitHub cron is always UTC and does not follow daylight saving.
    # 11:30 UTC = 7:30am Eastern in summer (EDT), 6:30am Eastern in winter (EST).
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the manual deploy workflow so the two can never publish at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Grade games that finished
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_results.py

      - name: Gather trend and weather context
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/prepare_predictions.py

      - name: Generate predictions with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_predictions.py

      - name: Apply predictions
        run: python scripts/apply_predictions.py

      - name: Sync your bet selections
        run: python scripts/sync_picks.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Daily refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Note: this job must deploy the site itself. A push made with the default
      # GITHUB_TOKEN deliberately does NOT trigger other workflows, so we can't
      # rely on a push-triggered deploy here.
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
